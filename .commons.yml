graph:
  name: claude-code-plugins        # becomes domain: on notes this graph promotes
  root: knowledge/
  atlas: principium.md
types:
  evidence:   { name: observation, dir: observations/, supports: patterns-decisions-or-questions }
  attractors:
    - { name: pattern,  dir: patterns/ }     # open — a recurring shape, accumulating evidence, no verdict
    - { name: decision, dir: decisions/ }    # settled — a design choice with its reasoning
    - { name: question, dir: questions/ }    # open — something unresolved; holds material until it graduates
  entity:
    - { name: plugin, dir: entities/ }       # lookup notes for named plugins
    - { name: skill,  dir: entities/ }       # lookup notes for named skills
  reference:  { name: reference, dir: reference/ }
  # The chronicle IS the session-level synthesis, so it sits on the output side of the pipeline,
  # not the input side. dir: is outside graph.root on purpose: these entries already exist at
  # this path and are adopted into the tier rather than re-authored inside knowledge/.
  synthesis:
    name: chronicle
    dir: docs/chronicle/
    produced-by: meta-claude:session-chronicle
sources:
  # Work sessions. One tier, because there is only one raw source for a session — the transcript.
  # The chronicle entry describing that session is this pipeline's own output; see types.synthesis.
  - type: session
    description: Full session transcript. The raw material for work sessions.
    # Glob, not a single directory: worktree sessions land in a sibling project directory whose
    # slug carries the worktree suffix, and they must be queued too.
    path: ~/.claude/projects/*claude-code-plugins*/
    # Top-level only. Subagent transcripts nest one level down, in a directory named for the
    # parent session's UUID, and are not sessions in their own right.
    glob: "*.jsonl"
    # Keyed on the UUID, not the path: a transcript moves between those directories when a
    # worktree is created or removed, and a path key would make a second note for one session.
    identity: "session:{uuid}"
    resolver: meta-claude:session-export
    # Committed, not a scratch path. The predecessor here was a gitignored exports directory, and
    # this graph's founding source note already points at a transcript that went with it.
    archive: knowledge/sources/raw/
    gate: public                                    # this repo is public — the preserve stage gates
  - { type: claude-code-docs, resolve: url }        # on-demand, hand-fed — no queue
sinks:
  - { name: tasks, tool: td, project: "claude code marketplace", approval: batch }
promotes-to: ~/Developer/commons
generated:                                 # owned by /graph-patch — applied-delta state
  process:
    template-version: 0.6.0
    applied: [step4-explicit-negative, step8-collect-nonreporting, step9-stamp-gate,
              step11-pull-target, step10-pending-patches, step10-entity-type-gap,
              preserve-stage, resolve-orphaned-synthesis, extract-from-raw,
              synthesis-in-plan, synthesis-write]
  knowledge-graph:
    template-version: 0.6.0
    applied: [synthesis-is-sibling]
